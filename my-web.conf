server {
    listen 80;
    server_name _;
    
    root /var/www/my-web/html;
    index index.html;

    # Khai báo trang lỗi 404
    error_page 404 /404.html;

    # Bảo vệ file 404.html khỏi truy cập trực tiếp từ Internet
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
